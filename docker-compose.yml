version: '3.1'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somatech_odoo_ec_web
    depends_on:
      - db
    ports:
      - "24500:8069"
      - "24501:8072"
    volumes:
      - ./odoo_custom_addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    restart: always
    # AUTO-INSTALL: All Ecuador modules + base business modules pre-installed
    # Spanish Ecuador language loaded, demo data included for CANNACHAIN S.A.S.
    command: -c /etc/odoo/odoo.conf -d odoo -i l10n_ec --load-language=es_EC
    deploy:
      resources:
        limits:
          memory: 3G

  db:
    image: postgres:15
    container_name: somatech_odoo_ec_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  django:
    build:
      context: ./django_mcp
    container_name: somatech_django_api
    depends_on:
      - web
    ports:
      - "24502:8000"
    volumes:
      - ./django_mcp:/app
    environment:
      - ODOO_URL=http://web:8069
      - ODOO_DB=odoo
      - ODOO_USERNAME=admin
      - ODOO_PASSWORD=admin
      - DJANGO_SETTINGS_MODULE=core.settings
      - SECRET_KEY=dev-secret
      - DEBUG=True
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  odoo-db-data:
