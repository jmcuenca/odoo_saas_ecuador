version: '3.1'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somatech_odoo_ec_web
    depends_on:
      - db
    ports:
      - "24500:8069"
      - "24501:8072"
    volumes:
      - ./odoo_custom_addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    restart: always

  db:
    image: postgres:15
    container_name: somatech_odoo_ec_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always

volumes:
  odoo-db-data:
