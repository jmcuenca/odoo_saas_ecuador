name: Deploy odoo_saas_ecuador

on:
  push:
    branches: ["19.0"]
    paths:
      - 'l10n_ec*/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      db_name:
        description: 'BD donde aplicar upgrade (vacío = autodetectar)'
        required: false
        default: ''
      modules:
        description: 'Módulos a actualizar (separados por coma)'
        required: false
        default: 'l10n_ec_sri'

jobs:
  deploy:
    name: Deploy to Ubuntu server
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull & upgrade on server
        env:
          DB_NAME: ${{ github.event.inputs.db_name || '' }}
          MODULES: ${{ github.event.inputs.modules || 'l10n_ec_sri' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "sudo DB_NAME='${DB_NAME}' MODULES='${MODULES}' bash /opt/odoo19/third-party-addons/odoo_saas_ecuador/scripts/deploy_saas.sh"
